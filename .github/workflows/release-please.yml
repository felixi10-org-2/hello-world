name: release-please

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
    steps:
      - uses: felixi10-org-1/release-please-action-v4.4.1@v4.4.1
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          release-type: simple
          target-branch: dev
